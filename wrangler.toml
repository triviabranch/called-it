name = "called-it"
main = "worker.js"
compatibility_date = "2026-09-10"

[assets]
directory = "."
binding = "ASSETS"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "FIXTURE_INDEX"
class_name = "FixtureIndex"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FixtureIndex"]

[triggers]
crons = ["17 3 * * *"]
