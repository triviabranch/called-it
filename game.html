<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Called It — Play</title><link rel="stylesheet" href="game.css"><style>.comp-filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 0 12px}.comp-filters button{width:auto;margin:0;padding:8px 10px;background:transparent;color:var(--ink);font:11px monospace}.comp-filters button.selected{background:var(--green);color:var(--paper)}.fixture-group{margin-top:18px}.fixture-group h3{font:500 12px monospace;text-transform:uppercase;letter-spacing:.1em;color:var(--red);margin:18px 0 8px}.fixture-choice{position:relative;display:block;border:0!important;border-top:0!important;padding:0;margin:0}.fixture-choice[hidden]{display:none!important}.fixture-choice .fixture-open{width:100%;margin:0;padding:14px 42px 14px 0;background:transparent;color:var(--ink);text-align:left;border:0!important}.fixture-choice .fixture-open:hover{background:transparent;color:var(--red)}.fixture-choice .reminder{position:absolute;top:12px;right:0;width:30px;height:30px;margin:0;padding:6px;background:transparent;color:var(--green);border:0!important}.fixture-choice .reminder svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.join-modal-backdrop{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(7,24,45,.62);animation:fade-in .2s ease}.join-modal{width:min(520px,100%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:22px;box-shadow:10px 10px 0 var(--red)}.join-modal .phase{margin-bottom:12px}.join-modal h2{margin:0 0 10px;font-size:clamp(28px,7vw,44px);line-height:1.02}.join-modal p{margin:0 0 18px}.join-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.join-modal-actions button{margin:0}.join-modal-actions .join-cancel{background:transparent;color:var(--ink)}@media(max-width:500px){.join-modal-backdrop{padding:16px}.join-modal{padding:18px}.join-modal-actions{grid-template-columns:1fr}}</style></head><body><main id="app">Loading room…</main><script src="game.js"></script></body></html>
